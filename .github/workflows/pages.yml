name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Free USDA FoodData Central key (read-only public food data). Without it the US database is skipped.
          VITE_USDA_KEY: ${{ secrets.VITE_USDA_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job: publishing in the same job as the upload sometimes ran before GitHub had
  # registered the uploaded build ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
